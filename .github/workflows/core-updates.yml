name: Core dependency updates

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: core-dependency-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check core updates
        id: updates
        run: node scripts/check-core-updates.mjs > core-updates.md

      - name: Create or update report issue
        if: steps.updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Core dependency updates available
        run: |
          gh label create dependencies --description 'Dependency updates' --color 0366d6 || true
          ISSUE_NUMBER="$(gh issue list --state open --search "in:title $ISSUE_TITLE" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | first | .number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file core-updates.md --add-label dependencies
          else
            gh issue create --title "$ISSUE_TITLE" --label dependencies --body-file core-updates.md
          fi
